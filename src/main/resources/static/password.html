<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Change Password - Enterprise LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar"></nav><main class="container" style="max-width:560px;margin-top:42px;"><div class="card" style="padding:30px;"><h1 style="font-size:1.5rem;color:var(--secondary);">Change password</h1><p style="color:var(--text-muted);margin:8px 0 24px;">Choose a new password with at least 8 characters.</p><div id="password-alert" class="alert alert-danger" style="display:none;"></div><form id="change-password-form"><div class="form-group"><label class="form-label" for="current-password">Current password</label><input id="current-password" type="password" class="form-control" required></div><div class="form-group"><label class="form-label" for="new-password">New password</label><input id="new-password" type="password" minlength="8" class="form-control" required></div><div class="form-group"><label class="form-label" for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="8" class="form-control" required></div><button class="btn btn-primary btn-block" type="submit">Update password</button></form></div></main><script type="module">import { API } from '/js/api.js'; import { requireAuth } from '/js/auth.js'; if (requireAuth()) { const alert=document.getElementById('password-alert'); const show=(m,ok=false)=>{alert.style.display='block';alert.className=ok?'alert alert-success':'alert alert-danger';alert.textContent=m;}; document.getElementById('change-password-form').addEventListener('submit',async e=>{e.preventDefault();const next=document.getElementById('new-password').value;if(next!==document.getElementById('confirm-password').value)return show('New passwords do not match.');try{const r=await API.post('/auth/change-password',{current_password:document.getElementById('current-password').value,new_password:next});e.target.reset();if(r.token)API.setSession(r.token,API.getUser());show(r.message,true);}catch(err){show(err.message);}}); }</script>  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/footer.js"></script>
</body></html>
