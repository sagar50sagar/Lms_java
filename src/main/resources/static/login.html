<!DOCTYPE html>
<html lang="en"><head><script>if(localStorage.getItem('lms_token'))location.replace(new URLSearchParams(location.search).get('redirect')||'/dashboard.html');</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Sign In - Corporate Training LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body style="background:var(--bg-page);display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px;">
  <div style="text-align:center;margin-bottom:24px;"><a href="/index.html" class="nav-brand" style="justify-content:center;margin-bottom:8px;"><span>Enterprise LMS</span></a><p style="color:var(--text-muted);font-size:.9rem;">Internal Workforce Training &amp; Compliance System</p></div>
  <div class="card" style="width:100%;max-width:440px;padding:32px;">
    <div id="auth-alert" class="alert alert-danger" style="display:none;"></div>
    <form id="password-form"><div class="form-group"><label class="form-label" for="login-email">Corporate Email</label><input type="email" id="login-email" class="form-control" required></div><div class="form-group"><label class="form-label" for="login-password">Password</label><input type="password" id="login-password" class="form-control" required></div><button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">Sign In to Portal</button></form>
  </div>
  <script type="module">
    import { API } from '/js/api.js';
    const alertEl=document.getElementById('auth-alert');
    function showAlert(message,success=false){alertEl.style.display='block';alertEl.className=success?'alert alert-success':'alert alert-danger';alertEl.textContent=message;}
    function redirect(){window.location.href=new URLSearchParams(location.search).get('redirect')||'/dashboard.html';}
    document.getElementById('password-form').addEventListener('submit',async e=>{e.preventDefault();try{const res=await API.post('/auth/login',{email:document.getElementById('login-email').value,password:document.getElementById('login-password').value});API.setSession(res.token,res.user);redirect();}catch(err){showAlert(err.message);}});
  </script>
  <script type="module" src="/js/theme.js"></script>
</body></html>
