<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In - Corporate Training LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body style="background:#f1f5f9;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;padding:20px;">
  <div style="text-align:center;margin-bottom:24px;"><a href="/index.html" class="nav-brand" style="justify-content:center;margin-bottom:8px;"><span>Enterprise LMS</span></a><p style="color:var(--text-muted);font-size:.9rem;">Internal Workforce Training &amp; Compliance System</p></div>
  <div class="card" style="width:100%;max-width:440px;padding:32px;">
    <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;"><button id="tab-otp" class="btn" style="flex:1;border-radius:0;border-bottom:2px solid var(--primary);color:var(--primary);background:none;">Email Code</button><button id="tab-password" class="btn" style="flex:1;border-radius:0;border-bottom:2px solid transparent;color:var(--text-muted);background:none;">Password</button></div>
    <div id="auth-alert" class="alert alert-danger" style="display:none;"></div>
    <form id="otp-form"><div class="form-group"><label class="form-label" for="otp-email">Corporate Email</label><input type="email" id="otp-email" class="form-control" placeholder="user@company.local" required></div><div id="code-group" class="form-group" style="display:none;"><label class="form-label" for="otp-code">Verification Code</label><input inputmode="numeric" autocomplete="one-time-code" maxlength="6" id="otp-code" class="form-control" placeholder="6-digit code"></div><button id="otp-submit" type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">Email Me a Sign-in Code</button></form>
    <form id="password-form" style="display:none;"><div class="form-group"><label class="form-label" for="login-email">Corporate Email</label><input type="email" id="login-email" class="form-control" required></div><div class="form-group"><label class="form-label" for="login-password">Password</label><input type="password" id="login-password" class="form-control" required></div><button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">Sign In to Portal</button></form>
    <div style="margin-top:20px;text-align:center;"><button id="show-reset" type="button" class="btn btn-secondary btn-sm">Set or reset password</button></div>
    <form id="reset-form" style="display:none;margin-top:20px;border-top:1px solid var(--border);padding-top:20px;"><p style="font-size:.9rem;color:var(--text-muted);margin-bottom:14px;">Enter your email to receive a one-time password-reset code.</p><div class="form-group"><label class="form-label" for="reset-email">Corporate Email</label><input type="email" id="reset-email" class="form-control" required></div><div class="form-group"><label class="form-label" for="reset-code">Reset code</label><input inputmode="numeric" maxlength="6" id="reset-code" class="form-control" required></div><div class="form-group"><label class="form-label" for="reset-password">New password</label><input type="password" minlength="8" id="reset-password" class="form-control" required></div><button id="reset-request" type="button" class="btn btn-secondary btn-block">Email a reset code</button><button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">Save Password</button></form>
  </div>
  <script type="module">
    import { API } from '/js/api.js';
    const alertEl=document.getElementById('auth-alert'); let otpSent=false;
    function showAlert(message,success=false){alertEl.style.display='block';alertEl.className=success?'alert alert-success':'alert alert-danger';alertEl.textContent=message;}
    function switchTab(tab){const otp=tab==='otp';document.getElementById('otp-form').style.display=otp?'block':'none';document.getElementById('password-form').style.display=otp?'none':'block';document.getElementById('tab-otp').style.borderBottomColor=otp?'var(--primary)':'transparent';document.getElementById('tab-otp').style.color=otp?'var(--primary)':'var(--text-muted)';document.getElementById('tab-password').style.borderBottomColor=otp?'transparent':'var(--primary)';document.getElementById('tab-password').style.color=otp?'var(--text-muted)':'var(--primary)';alertEl.style.display='none';}
    document.getElementById('tab-otp').onclick=()=>switchTab('otp'); document.getElementById('tab-password').onclick=()=>switchTab('password');
    function redirect(){window.location.href=new URLSearchParams(location.search).get('redirect')||'/dashboard.html';}
    document.getElementById('otp-form').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('otp-email').value;try{if(!otpSent){await API.post('/auth/otp/request',{email,purpose:'login'});otpSent=true;document.getElementById('code-group').style.display='block';document.getElementById('otp-code').required=true;document.getElementById('otp-submit').textContent='Verify & Sign In';showAlert('If your account is active, a code has been emailed.',true);}else{const res=await API.post('/auth/otp/verify-login',{email,code:document.getElementById('otp-code').value});API.setSession(res.token,res.user);redirect();}}catch(err){showAlert(err.message);}});
    document.getElementById('password-form').addEventListener('submit',async e=>{e.preventDefault();try{const res=await API.post('/auth/login',{email:document.getElementById('login-email').value,password:document.getElementById('login-password').value});API.setSession(res.token,res.user);redirect();}catch(err){showAlert(err.message);}});
    document.getElementById('show-reset').onclick=()=>{const form=document.getElementById('reset-form');form.style.display=form.style.display==='none'?'block':'none';};
    document.getElementById('reset-request').onclick=async()=>{try{await API.post('/auth/otp/request',{email:document.getElementById('reset-email').value,purpose:'password_reset'});showAlert('If your account is active, a reset code has been emailed.',true);}catch(err){showAlert(err.message);}};
    document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();try{const res=await API.post('/auth/password/complete',{email:document.getElementById('reset-email').value,code:document.getElementById('reset-code').value,password:document.getElementById('reset-password').value,purpose:'password_reset'});showAlert(res.message,true);}catch(err){showAlert(err.message);}});
  </script>
</body></html>
