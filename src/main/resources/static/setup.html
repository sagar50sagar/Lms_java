<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Set Up Account - Enterprise LMS</title><link rel="stylesheet" href="/css/style.css"></head>
<body style="background:#f1f5f9;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;"><main class="card" style="width:100%;max-width:440px;padding:32px;"><h1 style="font-size:1.5rem;color:var(--secondary);">Set up your LMS account</h1><p style="color:var(--text-muted);margin:8px 0 24px;">Create a password to activate your account.</p><div id="setup-alert" class="alert alert-danger" style="display:none;"></div><form id="setup-form"><div class="form-group"><label class="form-label" for="password">New password</label><input id="password" type="password" minlength="8" class="form-control" required></div><div class="form-group"><label class="form-label" for="confirm-password">Confirm password</label><input id="confirm-password" type="password" minlength="8" class="form-control" required></div><button type="submit" class="btn btn-primary btn-block">Set password</button></form><a id="login-link" href="/login.html" class="btn btn-secondary btn-block" style="display:none;margin-top:12px;">Go to login</a></main><script type="module">import { API } from '/js/api.js';const token=new URLSearchParams(location.search).get('token');const alert=document.getElementById('setup-alert');const show=(message,success=false)=>{alert.style.display='block';alert.className=success?'alert alert-success':'alert alert-danger';alert.textContent=message;};if(!token){document.getElementById('setup-form').style.display='none';show('This account setup link is invalid or has expired. Please contact your administrator.');}document.getElementById('setup-form').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm-password').value)return show('Passwords do not match.');try{const result=await API.post('/auth/account-setup',{token,password});e.target.style.display='none';show(result.message,true);document.getElementById('login-link').style.display='block';}catch(err){show(err.message);}});</script>  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/footer.js"></script>
</body></html>
