spring:
  # Load local development variables (including SMTP credentials) when present.
  # OS environment variables still take precedence in deployed environments.
  config:
    import: optional:file:.env[.properties]
  application:
    name: corporate-lms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  flyway:
    enabled: true
    # Allows a safe Spring Boot cutover when the schema was created by the legacy app.
    # Fresh databases still run V1 normally; existing schemas are recorded as baseline V1.
    baseline-on-migrate: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      # Jakarta Mail waits forever by default. A dead or throttled provider must not park a thread.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: ${PORT:8080}
  # Set to native or framework only behind a reverse proxy you control, together with
  # RATE_LIMIT_TRUST_PROXY=true, so client IPs and generated links survive the hop.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
  # Uploads are not a feature; a large body is only a way to exhaust request buffers.
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
app:
  # Set to production to enable the startup guard that rejects development secrets and demo seeding.
  environment: ${APP_ENV:development}
  rate-limit:
    # Enable only when a reverse proxy you control sets X-Forwarded-For; otherwise client IPs are spoofable.
    trust-forwarded-for: ${RATE_LIMIT_TRUST_PROXY:false}
    # Wrong-password budget per account (locks that account for 5 minutes) and per client IP (15 minutes).
    # A correct password always logs in, so these ceilings only ever slow down a guesser. The IP budget
    # counts requests rather than people, and a whole office shares one address, so it stays generous.
    login-attempts: ${RATE_LIMIT_LOGIN_ATTEMPTS:10}
    login-ip-attempts: ${RATE_LIMIT_LOGIN_IP_ATTEMPTS:200}
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  initial-admin:
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    full-name: ${INITIAL_ADMIN_FULL_NAME:Initial Administrator}
  mail:
    from: ${MAIL_FROM:no-reply@company.local}
    # smtp | postmark | resend. The HTTP providers work on hosts that block outbound SMTP ports.
    provider: ${MAIL_PROVIDER:smtp}
    api-key: ${MAIL_API_KEY:}
    # Only set this to point at a region-specific or self-hosted endpoint.
    api-url: ${MAIL_API_URL:}
    outbox:
      enabled: ${MAIL_OUTBOX_ENABLED:true}
      poll-ms: ${MAIL_OUTBOX_POLL_MS:2000}
      batch-size: 10
      max-attempts: 5
      retry-base-seconds: 60
  # Set to false in production. It only inserts data into an empty database.
  demo-data: ${DEMO_DATA:true}
  jwt:
    # Supply JWT_SECRET as a Base64 value in non-development environments.
    secret: ${JWT_SECRET:VGhpcy1pcy1hLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWNoYW5nZS1tZQ==}
    expiration: ${JWT_EXPIRATION:604800000}
